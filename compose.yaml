name: ${APP_NAME:?}

# One network (`app`) joins web and api. No database: the site only reads public data.
services:
  web:
    image: ${WEB_IMAGE:-${APP_NAME:?}-web}:${WEB_TAG:-main}
    build: ./frontend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    networks: [app]
  api:
    image: ${API_IMAGE:-${APP_NAME:?}-api}:${API_TAG:-main}
    build:
      context: ./backend/Api
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-vulinm/milanvulin-site}
      # Local language model for the chat panel. Both empty means the chat is switched off.
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Optional GPU exporter (Prometheus text) for the GPU panel; see docs/local-llm.md. Empty hides the card readings.
      GPU_METRICS_URL: ${GPU_METRICS_URL:-}
    networks: [app]
networks:
  app: {}
