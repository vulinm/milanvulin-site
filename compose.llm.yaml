# Optional server overlay: joins the api to the shared network of the local language model.
# Enable it only after the model service exists on the server: add it to COMPOSE_FILE in .env
# (compose.yaml:compose.platform.yaml:compose.llm.yaml) and set LLM_URL and LLM_MODEL there.
# Without it the chat panel simply stays hidden.
# ./profile/Profile.md next to this file (on the server only, never committed) is what the chat model knows
# about Milan. It is required: without it the chat stays off (see scripts/update-profile.sh). Create the folder
# yourself first, otherwise Docker creates it owned by root.
services:
  api:
    networks:
      app: {}
      llm: {}
    volumes:
      - ./profile:/app/profile:ro
networks:
  llm:
    external: true
    name: stack_llm
